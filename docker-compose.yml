services:
  mysql-db:
    image: mysql:8.0
    container_name: libreria-estudio-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-libreria_estudio}
      MYSQL_USER: ${DB_USER:-libreria_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-internal-net

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreria-estudio-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: mysql-db
      DB_PORT: 3306
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - backend-internal-net
      - backend-public-net

volumes:
  mysql_data:
    driver: local

networks:
  backend-internal-net:
    driver: bridge
    internal: true
  backend-public-net:
    driver: bridge
